<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Answer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
        }

        header h2 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 70px 20px;
        }

        .answer-card {
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .answer-card h1 {
            font-size: 36px;
            margin-top: 0;
        }

        .correct {
            color: #16a34a;
        }

        .incorrect {
            color: #dc2626;
        }

        .correct-answer {
            margin: 25px 0;
            padding: 18px;
            background: #f4f7fb;
            border-radius: 10px;
            font-size: 17px;
        }

        .explanation {
            text-align: left;
            margin-top: 30px;
            padding: 25px;
            background: #f9fafb;
            border-radius: 12px;
            line-height: 1.6;
        }

        .explanation h3 {
            margin-top: 0;
        }

        .next-button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .next-button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {
            .answer-card {
                padding: 30px 20px;
            }

            .answer-card h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>AP CSP Practice Generator</h2>
</header>

<div class="container">

    <div class="answer-card">

        {% if correct %}

            <h1 class="correct">✅ Correct!</h1>

        {% else %}

            <h1 class="incorrect">❌ Incorrect!</h1>

            <div class="correct-answer">
                <strong>The correct answer was:</strong>
                {{ question.answer }}
            </div>

        {% endif %}

        <div class="explanation">
            <h3>Explanation</h3>

            <p>{{ question.explanation }}</p>
        </div>

        <form action="/next">
            <button type="submit" class="next-button">
                Next Question
            </button>
        </form>

    </div>

</div>

</body>
</html>
